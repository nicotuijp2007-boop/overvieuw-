# Netlify config. The Next.js runtime plugin turns the app's server code into Netlify
# Functions; without it only static files are deployed and every page is "not found".
# Note: on credit-based plans every production deploy costs credits (15 on Free),
# so production deploys only happen from the `main` branch (see README).
[build]
  command = "npm run build"
  publish = ".next"
  # Skip the (paid) build when nothing the site uses changed, e.g. only scripts/ or README.
  # Exit code 0 = skip. On the first build CACHED_COMMIT_REF is empty, so git fails and it builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src package.json package-lock.json next.config.ts limits.config.ts postcss.config.mjs tsconfig.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
