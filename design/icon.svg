<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Limieten app icon: a gauge showing what's left. Source for the PNGs (scripts/make-icons.mjs). -->
  <rect width="512" height="512" fill="#1a1a19"/>
  <g transform="translate(0 22)">
  <g fill="none" stroke-linecap="round" stroke-width="44">
    <!-- track: a 240-degree arc -->
    <path d="M 165.5 377.5 A 150 150 0 1 1 346.5 377.5" stroke="#3a3a37"/>
    <!-- what's left: muted green, then the warning tip -->
    <path d="M 165.5 377.5 A 150 150 0 0 1 128.9 177" stroke="#78a46e"/>
    <path d="M 128.9 177 A 150 150 0 0 1 196 128.3" stroke="#fab219"/>
  </g>
  <!-- needle -->
  <line x1="256" y1="256" x2="211" y2="160" stroke="#f0efec" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="28" fill="#f0efec"/>
  </g>
</svg>
